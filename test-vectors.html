<!DOCTYPE html>
<html>
<head>
    <title>Test Vectors</title>
    <script src="p5.min.js"></script>
    <script src="app.js"></script>
    <script>
    window.setup = function() {
        createCanvas(100, 100);
        
        let sys = buildSpectreBase();
        let superSys = buildSupertiles(sys);
        let tile = superSys['Delta'];
        let quad = tile.quad;
        
        console.log('Testing different vector combinations:');
        
        // Original (before my changes)
        let vec1_orig = {x: quad[1].x - quad[0].x, y: quad[1].y - quad[0].y};
        let vec2_orig = {x: quad[3].x - quad[0].x, y: quad[3].y - quad[0].y};
        console.log('Original:');
        console.log('  vec1 = quad[1] - quad[0] =', vec1_orig);
        console.log('  vec2 = quad[3] - quad[0] =', vec2_orig);
        
        // My new approach
        let vec1_new = {x: quad[2].x - quad[0].x, y: quad[2].y - quad[0].y};
        let vec2_new = {x: quad[3].x - quad[1].x, y: quad[3].y - quad[1].y};
        console.log('New approach:');
        console.log('  vec1 = quad[2] - quad[0] =', vec1_new);
        console.log('  vec2 = quad[3] - quad[1] =', vec2_new);
        
        // Check if either forms a proper tiling
        // For original vectors, check if vec1 + vec2 gives us quad[2]
        let expected_q2_orig = {
            x: quad[0].x + vec1_orig.x + vec2_orig.x,
            y: quad[0].y + vec1_orig.y + vec2_orig.y
        };
        console.log('Original vectors parallelogram check:');
        console.log('  quad[0] + vec1 + vec2 =', expected_q2_orig);
        console.log('  actual quad[2] =', quad[2]);
        console.log('  Match?', Math.abs(expected_q2_orig.x - quad[2].x) < 0.01 && Math.abs(expected_q2_orig.y - quad[2].y) < 0.01);
        
        // For new vectors, check if they form a proper tiling
        // vec1 goes from quad[0] to quad[2]
        // vec2 goes from quad[1] to quad[3]
        // Check if quad[0] + vec1 = quad[2] (should be true by construction)
        console.log('New vectors validation:');
        console.log('  quad[0] + vec1 should equal quad[2]');
        let check1 = {x: quad[0].x + vec1_new.x, y: quad[0].y + vec1_new.y};
        console.log('  Result:', check1, 'vs', quad[2]);
        console.log('  Match?', Math.abs(check1.x - quad[2].x) < 0.01 && Math.abs(check1.y - quad[2].y) < 0.01);
        
        console.log('  quad[1] + vec2 should equal quad[3]');
        let check2 = {x: quad[1].x + vec2_new.x, y: quad[1].y + vec2_new.y};
        console.log('  Result:', check2, 'vs', quad[3]);
        console.log('  Match?', Math.abs(check2.x - quad[3].x) < 0.01 && Math.abs(check2.y - quad[3].y) < 0.01);
        
        // The key question: when we tile using these vectors, do adjacent tiles align?
        // For that, we need to understand the relationship between the quad points
        console.log('\nAnalyzing quad point relationships:');
        console.log('  Distance quad[0] to quad[1]:', Math.hypot(quad[1].x - quad[0].x, quad[1].y - quad[0].y));
        console.log('  Distance quad[2] to quad[3]:', Math.hypot(quad[3].x - quad[2].x, quad[3].y - quad[2].y));
        console.log('  Distance quad[0] to quad[3]:', Math.hypot(quad[3].x - quad[0].x, quad[3].y - quad[0].y));
        console.log('  Distance quad[1] to quad[2]:', Math.hypot(quad[2].x - quad[1].x, quad[2].y - quad[1].y));
    };
    </script>
</head>
<body></body>
</html>
