<!DOCTYPE html>
<html>
<head>
    <title>Debug Quad</title>
    <script src="p5.min.js"></script>
    <script src="app.js"></script>
    <script>
    // Override setup to log quad info
    const originalSetup = window.setup;
    window.setup = function() {
        originalSetup();
        
        // Build supertiles to get the quad
        let sys = buildSpectreBase();
        let superSys = buildSupertiles(sys);
        let tile = superSys['Delta'];
        let quad = tile.quad;
        
        console.log('Quad points:');
        console.log('quad[0]:', quad[0]);
        console.log('quad[1]:', quad[1]);
        console.log('quad[2]:', quad[2]);
        console.log('quad[3]:', quad[3]);
        
        // Check if it's a parallelogram
        let vec1 = {x: quad[1].x - quad[0].x, y: quad[1].y - quad[0].y};
        let vec2_old = {x: quad[3].x - quad[0].x, y: quad[3].y - quad[0].y};
        let vec2_new = {x: quad[2].x - quad[0].x, y: quad[2].y - quad[0].y};
        
        console.log('vec1 (quad[1]-quad[0]):', vec1);
        console.log('vec2_old (quad[3]-quad[0]):', vec2_old);
        console.log('vec2_new (quad[2]-quad[0]):', vec2_new);
        
        // Check parallelogram with old vectors
        let expected_quad2_old = {
            x: quad[0].x + vec1.x + vec2_old.x,
            y: quad[0].y + vec1.y + vec2_old.y
        };
        console.log('Expected quad[2] with old vectors:', expected_quad2_old);
        console.log('Actual quad[2]:', quad[2]);
        console.log('Difference old:', {
            x: quad[2].x - expected_quad2_old.x,
            y: quad[2].y - expected_quad2_old.y
        });
        
        // Check parallelogram with new vectors
        let expected_quad3_new = {
            x: quad[0].x + vec1.x + vec2_new.x,
            y: quad[0].y + vec1.y + vec2_new.y
        };
        console.log('Expected quad[3] with new vectors:', expected_quad3_new);
        console.log('Actual quad[3]:', quad[3]);
        console.log('Difference new:', {
            x: quad[3].x - expected_quad3_new.x,
            y: quad[3].y - expected_quad3_new.y
        });
    };
    </script>
</head>
<body></body>
</html>
